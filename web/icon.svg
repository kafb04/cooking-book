      <feComposite in="hl" in2="sh" operator="arithmetic" k2=".5" k3="1"/>
    </filter>
  </defs>
  <!-- couro com relevo -->
  <rect width="512" height="512" fill="url(#lea)"/>
  <rect width="512" height="512" filter="url(#tex)" style="mix-blend-mode:multiply"/>
