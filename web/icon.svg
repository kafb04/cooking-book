<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lea" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#94603a"/><stop offset=".5" stop-color="#6b3d22"/><stop offset="1" stop-color="#2c170b"/></radialGradient>
    <filter id="tex"><feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="4" seed="4"/><feDiffuseLighting lighting-color="#fff" surfaceScale="1.8"><feDistantLight azimuth="225" elevation="58"/></feDiffuseLighting></filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
