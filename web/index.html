<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Livro de Receitas</title>
  <meta name="theme-color" content="#2c170b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Homemade+Apple&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book.css">
  <link rel="stylesheet" href="css/recipe.css">
  <link rel="stylesheet" href="css/editor.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <linearGradient id="g-leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--leather-light)"/><stop offset=".55" style="stop-color: var(--leather)"/><stop offset="1" style="stop-color: var(--leather-dark)"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--gold-light)"/><stop offset=".5" style="stop-color: var(--gold)"/><stop offset="1" style="stop-color: var(--gold-dark)"/></linearGradient>
    <!-- Seta: folha élfica apontando pra direita, com caule em espiral -->
    <symbol id="i-leaf" viewBox="0 0 64 48">
      <path class="leaf-btn__stem" d="M9 24C5 24 2.5 21.5 3.5 18.5 4.5 15.8 8 16 8 18.6"/>
      <path class="leaf-btn__blade" d="M9 24C19 6 44 4 61 24 44 44 19 42 9 24Z"/>
      <path class="leaf-btn__vein" d="M13 24H56M24 24l5-7M24 24l5 7M44 24l4-5M44 24l4 5"/>
      <path class="leaf-btn__chevron" d="M31 17 38 24 31 31"/>
    </symbol>
    <!-- Relevo da douração (luz + sombra a partir do próprio desenho) -->
    <filter id="f-emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant=".75" specularExponent="18" lighting-color="#fff" result="s"><feDistantLight azimuth="235" elevation="42"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="hl"/>
      <feDropShadow in="SourceGraphic" dx="0" dy="1.6" stdDeviation="1.1" flood-opacity=".65" result="sh"/>
      <feComposite in="hl" in2="sh" operator="arithmetic" k2=".5" k3="1"/>
    </filter>
    <!-- Medalhão da capa: unicórnio alado empinando -->
    <!-- Fases da lua: crescente, quarto, cheia, quarto, minguante -->
    <symbol id="art-moons" viewBox="0 0 100 12">
      <g class="moons__disc"><circle cx="14" cy="6" r="4"/><circle cx="32" cy="6" r="4"/><circle cx="68" cy="6" r="4"/><circle cx="86" cy="6" r="4"/></g>
      <g class="moons__lit">
        <path d="M14 2A4 4 0 0 1 14 10 2.4 4 0 0 0 14 2Z"/><path d="M32 2A4 4 0 0 1 32 10Z"/>
        <circle cx="50" cy="6" r="5"/>
        <path d="M68 2A4 4 0 0 0 68 10Z"/><path d="M86 2A4 4 0 0 0 86 10 2.4 4 0 0 1 86 2Z"/>
        <circle cx="23" cy="6" r=".7"/><circle cx="41" cy="6" r=".7"/><circle cx="59" cy="6" r=".7"/><circle cx="77" cy="6" r=".7"/>
      </g>
    </symbol>
    <symbol id="art-unicorn" viewBox="-14 -14 148 128">
      <!-- anel de símbolos astrológicos em volta do medalhão -->
      <ellipse class="unicorn__band" cx="60" cy="50" rx="72" ry="62"/>
      <ellipse class="unicorn__band" cx="60" cy="50" rx="61" ry="51"/>
      <path id="unicorn-ring" d="M60 -7.5a66.5 56.5 0 1 1-.01 0" fill="none"/>
      <text class="unicorn__runes"><textPath href="#unicorn-ring" textLength="384" lengthAdjust="spacing">☉ ✶ ☽ ✶ ♃ ✶ ♄ ✶ ☿ ✶ ♀ ✶ ♂ ✶ ☉ ✶ ☽ ✶ ♃ ✶ ♄ ✶ ☿ ✶ ♀ ✶ ♂ ✶</textPath></text>
      <ellipse class="unicorn__plate" cx="60" cy="50" rx="58" ry="48"/>
      <ellipse class="unicorn__ring" cx="60" cy="50" rx="53" ry="43"/>
      <path class="unicorn__scene" d="M14 74l12-9 9 6 13-12 10 9 9-7 12 10 10-6 12 9M20 40l3-2 3 2M30 32l2-1.5 2 1.5M94 30l3-2 3 2M100 42l2-1.5 2 1.5"/>
      <g filter="url(#f-emboss)" transform="translate(14 10) scale(.78)">
        <path class="unicorn__body unicorn__wing-far" d="M62 40C60 26 58 14 54 0c4 4 6 6 6 10 2 0 4 2 4 6 2 0 4 4 2 8 3 2 2 6 0 8z"/>
        <g class="unicorn__body">
          <path d="M58 42C52 28 42 14 28 4c2 6 2 10 6 14-4 0-6 4-2 8-4 1-4 5 0 8-3 2-1 6 4 7-2 3 2 6 8 5 4 2 10 0 14-4z"/>
          <path d="M38 58C26 54 18 64 14 74c-3 8 2 14-6 20 12-4 12-14 18-22 4-6 8-8 14-8z"/>
          <path d="M62 40c-10 2-20 8-26 18-4 8 0 16 8 18 8 1 16-6 22-14 4-6 6-12 4-18z"/>
          <path d="M60 42c2-10 6-20 14-27l2-3 2 2c4-2 8 1 11 6 2 3 2 5-1 6-3 0-6-1-9-2-3 6-5 14-7 22z"/>
          <path d="M80 13L93 1 83 15z"/>
          <path d="M72 16c-8 2-10 10-14 14 4 0 2 6-2 10 4 0 4 4 4 6l6-10z"/>
        </g>
        <path class="unicorn__legs" d="M66 52l13-6 4 11M64 56l11-2 1 10M46 70c-4 6-10 10-12 14l6 12M52 72c0 8-2 12-2 16l4 8"/>
        <path class="unicorn__lines" d="M34 18c6 6 12 14 20 22M32 26c8 6 14 11 22 16M32 34c8 4 14 7 20 10M82 17.5h.1"/>
      </g>
    </symbol>
  </svg>

  <header class="hud">
    <h1 class="hud__logo">Livro de Receitas</h1>
    <nav class="hud__actions">
      <button class="btn" type="button" data-action="new">Nova receita</button>
      <label class="btn btn--quiet">Importar .docx<input type="file" id="import" accept=".docx" multiple hidden></label>
    </nav>
  </header>

  <main class="stage">
    <button class="arrow arrow--prev" type="button" data-turn="-1" aria-label="Página anterior"><svg viewBox="0 0 64 48"><use href="#i-leaf"/></svg></button>
    <div class="book" id="book" aria-live="polite"></div>
    <button class="arrow arrow--next" type="button" data-turn="1" aria-label="Próxima página"><svg viewBox="0 0 64 48"><use href="#i-leaf"/></svg></button>
  </main>

  <dialog class="sheet" id="editor">
    <form class="sheet__form" method="dialog">
      <header class="sheet__bar">
        <h2 class="sheet__title">Nova receita</h2>
        <button class="link-btn sheet__close" value="cancel" formnovalidate aria-label="Fechar">✕</button>
      </header>
      <div class="sheet__body">
        <label class="field"><span class="field__label">Nome da receita</span>
          <input name="title" required maxlength="200" autocomplete="off"></label>
        <label class="field"><span class="field__label">Categoria</span>
          <input name="category" list="categories" maxlength="60" placeholder="Doces, salgados, massas..." autocomplete="off"></label>
        <datalist id="categories"></datalist>
        <div class="field field--photo">
          <span class="field__label">Foto do prato</span>
          <figure class="photo photo--mini"><img alt="Prévia da foto"></figure>
          <div class="field__actions">
            <label class="btn btn--paper btn--small">Escolher foto<input type="file" id="photo" accept="image/*" hidden></label>
            <button class="btn btn--paper btn--small" type="button" data-photo-clear>Remover</button>
          </div>
        </div>
        <div id="sections"></div>
      </div>
      <footer class="sheet__foot">
        <button class="btn btn--paper btn--danger" type="button" data-delete>Apagar receita</button>
        <button class="btn" type="submit" value="save">Guardar no livro</button>
      </footer>
    </form>
  </dialog>

  <output class="toast" id="toast"></output>

  <!-- ========== Páginas do livro (clonadas por js/pages.js) ========== -->
  <template id="tpl-cover">
    <article class="page page--cover leather" data-goto="toc" title="Abrir o livro">
      <div class="clasp" aria-hidden="true"></div>
      <div class="cover__content">
        <svg class="moons" viewBox="0 0 100 12" aria-hidden="true"><use href="#art-moons"/></svg>
        <svg class="cover__unicorn" viewBox="0 0 148 128" aria-hidden="true"><use href="#art-unicorn"/></svg>
        <p class="cover__pre">Livro de</p>
        <h2 class="cover__title">Receitas</h2>
        <p class="cover__sub">da família</p>
        <p class="cover__ornament" aria-hidden="true">❦</p>
      </div>
    </article>
  </template>

  <template id="tpl-endpaper">
    <article class="page page--endpaper">
      <div class="bookplate"><svg class="moons" viewBox="0 0 100 12" aria-hidden="true"><use href="#art-moons"/></svg><p class="bookplate__head">Ex Libris</p><p class="bookplate__text"></p><span class="bookplate__line"></span></div>
    </article>
  </template>

  <template id="tpl-toc">
    <article class="page page--toc">
      <h2 class="heading">Sumário</h2>
      <ol class="toc page__scroll"></ol>
      <span class="page__num"></span>
    </article>
  </template>

  <template id="tpl-toc-item">
    <li><a class="toc__item" data-goto>
      <span class="toc__name"></span><span class="toc__tag"></span><span class="toc__dots"></span><span class="toc__num"></span>
    </a></li>
  </template>

  <template id="tpl-notes">
    <article class="page page--notes">
      <h2 class="heading">Anotações</h2>
      <div class="page__scroll lined"></div>
      <span class="page__num"></span>
    </article>
  </template>

  <template id="tpl-plain"><article class="page page--plain"></article></template>

  <template id="tpl-back">
    <article class="page page--back leather" data-goto="start" title="Voltar pra capa">
      <div class="cover__content cover__content--back">
        <svg class="moons" viewBox="0 0 100 12" aria-hidden="true"><use href="#art-moons"/></svg>
        <p class="cover__ornament" aria-hidden="true">❦</p>
      </div>
    </article>
  </template>

  <!-- Layout padrão de toda receita: duas páginas lado a lado -->
  <template id="tpl-recipe">
    <article class="page page--recipe">
      <a class="ribbon" data-goto="toc" href="#/sumario" aria-label="Voltar ao sumário"></a>
      <header class="recipe__head">
        <span class="recipe__tag" data-field="category"></span>
        <h2 class="recipe__title" data-field="title"></h2>
        <button class="link-btn recipe__edit" type="button" data-edit>✎ editar</button>
      </header>
      <figure class="photo" data-edit>
        <img data-media="photo" alt="" loading="lazy" decoding="async">
        <figcaption class="photo__empty">foto do prato</figcaption>
      </figure>
      <section class="recipe__section">
        <h3 class="recipe__label">Ingredientes</h3>
        <div class="page__scroll lined">
          <ul class="recipe__list" data-field="ingredients"></ul>
          <img class="ink" data-media="ink_ingredients" alt="Ingredientes escritos à mão" loading="lazy">
        </div>
      </section>
      <span class="page__num"></span>
    </article>
    <article class="page page--recipe">
      <section class="recipe__section">
        <h3 class="recipe__label">Modo de preparo</h3>
        <div class="page__scroll lined">
          <div class="recipe__steps" data-field="steps"></div>
          <img class="ink" data-media="ink_steps" alt="Modo de preparo escrito à mão" loading="lazy">
        </div>
      </section>
      <aside class="note">
        <h3 class="note__label">Observações</h3>
        <div class="note__body">
          <div class="recipe__notes" data-field="notes"></div>
          <img class="ink" data-media="ink_notes" alt="Observações escritas à mão" loading="lazy">
        </div>
      </aside>
      <span class="page__num"></span>
    </article>
  </template>

  <!-- Bloco de seção do editor (Ingredientes / Modo de preparo / Observações) -->
  <template id="tpl-section">
    <fieldset class="section">
      <legend class="section__label"></legend>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-mode="text">Teclado</button>
        <button class="tab" type="button" role="tab" data-mode="ink">Caneta</button>
      </div>
      <textarea class="lined" rows="6"></textarea>
      <div class="ink-pad">
        <canvas width="1000" height="800"></canvas>
        <div class="ink-pad__tools">
          <button class="btn btn--paper btn--small" type="button" data-tool="pen">Caneta</button>
          <button class="btn btn--paper btn--small" type="button" data-tool="eraser">Borracha</button>
          <button class="btn btn--paper btn--small" type="button" data-tool="clear">Limpar</button>
        </div>
      </div>
    </fieldset>
  </template>
</body>
</html>
