<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Livro de Receitas</title>
  <meta name="theme-color" content="#e0218a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fredoka:wght@400..700&family=Pacifico&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book.css">
  <link rel="stylesheet" href="css/recipe.css">
  <link rel="stylesheet" href="css/editor.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.2s-7.6-4.6-10-9.4C.3 8.3 2.3 3.8 6.3 3.8c2.4 0 4 1.4 5.7 3.6 1.7-2.2 3.3-3.6 5.7-3.6 4 0 6 4.5 4.3 8-2.4 4.8-10 9.4-10 9.4z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.2 9.6h8.6V5.9c0-1.1 1.3-1.7 2.1-1l7 6.1c.6.5.6 1.4 0 1.9l-7 6.1c-.8.7-2.1.1-2.1-1v-3.7H4.2a2.1 2.1 0 0 1 0-4.2z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 0c.9 6.4 2.8 9.6 12 12-9.2 2.4-11.1 5.6-12 12-.9-6.4-2.8-9.6-12-12C9.2 9.6 11.1 6.4 12 0z"/></symbol>
  </svg>

  <header class="hud">
    <h1 class="hud__logo"><svg class="icon"><use href="#i-heart"/></svg> Receitinhas</h1>
    <nav class="hud__actions">
      <button class="btn" type="button" data-action="new">+ Nova receita</button>
      <label class="btn btn--lilac">Importar .docx<input type="file" id="import" accept=".docx" multiple hidden></label>
    </nav>
  </header>

  <main class="stage">
    <button class="arrow arrow--prev" type="button" data-turn="-1" aria-label="Página anterior">
      <svg class="icon"><use href="#i-arrow"/></svg><svg class="arrow__heart"><use href="#i-heart"/></svg>
    </button>
    <div class="book" id="book" aria-live="polite"></div>
    <button class="arrow arrow--next" type="button" data-turn="1" aria-label="Próxima página">
      <svg class="icon"><use href="#i-arrow"/></svg><svg class="arrow__heart"><use href="#i-heart"/></svg>
    </button>
  </main>

  <dialog class="window" id="editor">
    <form class="window__form" method="dialog">
      <header class="window__bar">
        <h2 class="window__title">Nova receita</h2>
        <button class="btn-round" value="cancel" formnovalidate aria-label="Fechar">✕</button>
      </header>
      <div class="window__body">
        <label class="field"><span class="field__label">Nome da receita</span>
          <input name="title" required maxlength="200" autocomplete="off"></label>
        <label class="field"><span class="field__label">Categoria</span>
          <input name="category" list="categories" maxlength="60" placeholder="Doces, salgados, da vó..." autocomplete="off"></label>
        <datalist id="categories"></datalist>
        <div class="field field--photo">
          <span class="field__label">Foto do prato</span>
          <figure class="polaroid polaroid--mini"><img alt="Prévia da foto"></figure>
          <div class="field__actions">
            <label class="btn btn--small">Escolher foto<input type="file" id="photo" accept="image/*" hidden></label>
            <button class="btn btn--small btn--ghost" type="button" data-photo-clear>Remover</button>
          </div>
        </div>
        <div id="sections"></div>
      </div>
      <footer class="window__foot">
        <button class="btn btn--ghost" type="button" data-delete>Apagar receita</button>
        <button class="btn" type="submit" value="save">Guardar no livro ♥</button>
      </footer>
    </form>
  </dialog>

  <output class="toast" id="toast"></output>

  <!-- ========== Páginas do livro (clonadas por js/pages.js) ========== -->
  <template id="tpl-cover">
    <article class="page page--cover velvet" data-goto="toc" title="Abrir o livro">
      <div class="clasp" aria-hidden="true"><svg><use href="#i-heart"/></svg></div>
      <svg class="sparkle" style="--x:18%;--y:16%;--d:0s"><use href="#i-sparkle"/></svg>
      <svg class="sparkle" style="--x:74%;--y:24%;--d:.8s"><use href="#i-sparkle"/></svg>
      <svg class="sparkle" style="--x:26%;--y:78%;--d:1.6s"><use href="#i-sparkle"/></svg>
      <div class="cover__content">
        <svg class="cover__emblem"><use href="#i-heart"/></svg>
        <p class="cover__pre">Meu livro de</p>
        <h2 class="cover__title">Receitas</h2>
        <p class="cover__sub">receitinhas feitas com amor</p>
      </div>
    </article>
  </template>

  <template id="tpl-endpaper">
    <article class="page page--endpaper">
      <div class="endpaper__card"><p class="endpaper__text"></p><span class="endpaper__line"></span></div>
    </article>
  </template>

  <template id="tpl-toc">
    <article class="page page--toc">
      <h2 class="banner">Sumário</h2>
      <ol class="toc page__scroll"></ol>
      <span class="page__num"></span>
    </article>
  </template>

  <template id="tpl-toc-item">
    <li><a class="toc__item" data-goto>
      <span class="toc__name"></span><span class="toc__tag"></span><span class="toc__dots"></span><span class="toc__num"></span>
    </a></li>
  </template>

  <template id="tpl-notes">
    <article class="page page--notes">
      <h2 class="banner banner--soft">Anotações</h2>
      <div class="page__scroll lined"></div>
      <span class="page__num"></span>
    </article>
  </template>

  <template id="tpl-plain"><article class="page page--plain"></article></template>

  <template id="tpl-back">
    <article class="page page--back velvet" data-goto="start" title="Voltar pra capa">
      <svg class="sparkle" style="--x:70%;--y:20%;--d:.4s"><use href="#i-sparkle"/></svg>
      <svg class="sparkle" style="--x:24%;--y:70%;--d:1.2s"><use href="#i-sparkle"/></svg>
      <div class="cover__content">
        <svg class="cover__emblem cover__emblem--small"><use href="#i-heart"/></svg>
        <p class="cover__sub">feito com amor, manteiga<br>e um pouquinho de açúcar</p>
      </div>
    </article>
  </template>

  <!-- Layout padrão de toda receita: duas páginas lado a lado -->
  <template id="tpl-recipe">
    <article class="page page--recipe">
      <a class="ribbon" data-goto="toc" href="#/sumario" aria-label="Voltar ao sumário"></a>
      <header class="recipe__head">
        <span class="recipe__tag" data-field="category"></span>
        <h2 class="recipe__title" data-field="title"></h2>
        <button class="btn-round btn-round--sticker" type="button" data-edit aria-label="Editar receita">✎</button>
      </header>
      <figure class="polaroid" data-edit>
        <img data-media="photo" alt="" loading="lazy" decoding="async">
        <figcaption class="polaroid__empty">♥ foto do prato ♥</figcaption>
      </figure>
      <section class="recipe__section">
        <h3 class="recipe__label"><svg class="icon"><use href="#i-heart"/></svg> Ingredientes</h3>
        <div class="page__scroll lined">
          <ul class="recipe__list" data-field="ingredients"></ul>
          <img class="ink" data-media="ink_ingredients" alt="Ingredientes escritos à mão" loading="lazy">
        </div>
      </section>
      <span class="page__num"></span>
    </article>
    <article class="page page--recipe">
      <section class="recipe__section">
        <h3 class="recipe__label"><svg class="icon"><use href="#i-heart"/></svg> Como fazer</h3>
        <div class="page__scroll lined">
          <div class="recipe__steps" data-field="steps"></div>
          <img class="ink" data-media="ink_steps" alt="Modo de fazer escrito à mão" loading="lazy">
        </div>
      </section>
      <aside class="postit">
        <h3 class="postit__label">Observações</h3>
        <div class="postit__body">
          <div class="recipe__notes" data-field="notes"></div>
          <img class="ink" data-media="ink_notes" alt="Observações escritas à mão" loading="lazy">
        </div>
      </aside>
      <span class="page__num"></span>
    </article>
  </template>

  <!-- Bloco de seção do editor (Ingredientes / Como fazer / Observações) -->
  <template id="tpl-section">
    <fieldset class="section">
      <legend class="section__label"></legend>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-mode="text">⌨ Teclado</button>
        <button class="tab" type="button" role="tab" data-mode="ink">✎ Caneta</button>
      </div>
      <textarea class="lined" rows="6"></textarea>
      <div class="ink-pad">
        <canvas width="1000" height="800"></canvas>
        <div class="ink-pad__tools">
          <button class="btn btn--small" type="button" data-tool="pen">Caneta</button>
          <button class="btn btn--small btn--lilac" type="button" data-tool="eraser">Borracha</button>
          <button class="btn btn--small btn--ghost" type="button" data-tool="clear">Limpar</button>
        </div>
      </div>
    </fieldset>
  </template>
</body>
</html>
